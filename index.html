<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14151a" media="(prefers-color-scheme: dark)">
<title>Rotina</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rotina">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--soft:#efede8;--line:#e3e0d9;
  --tx:#1d1d1f;--tx2:#6b6a66;--tx3:#a3a19b;
  --acc:#2f6fdf;--acc-soft:#e6eefc;
  --red:#d6403a;--red-soft:#fbe9e8;
  --amb:#c27a00;--amb-soft:#fbf1dc;
  --grn:#2e9b62;--grn-soft:#e3f4ea;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --r:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14151a;--card:#1d1f26;--soft:#262832;--line:#30333e;
    --tx:#ecedf1;--tx2:#9a9dab;--tx3:#5f6270;
    --acc:#6c9cf5;--acc-soft:#232f48;
    --red:#f0716b;--red-soft:#3a2326;
    --amb:#e9a93c;--amb-soft:#3a3020;
    --grn:#4fc489;--grn-soft:#1f3529;
    --shadow:none;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 16px calc(80px + env(safe-area-inset-bottom))}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.today{color:var(--tx2);font-size:14px}

/* entrada */
.composer{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.composer:focus-within{border-color:var(--acc)}
#entrada{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--tx);font:inherit;font-size:16px;min-height:26px;max-height:240px;line-height:1.5}
#entrada::placeholder{color:var(--tx3)}
.composer-foot{display:flex;align-items:center;gap:8px;margin-top:8px;min-height:30px}
#preview{flex:1;display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--tx2)}
.btn-add{background:var(--acc);color:#fff;border-radius:8px;padding:6px 14px;font-weight:600;font-size:14px}
.btn-add:disabled{opacity:.35;cursor:default}
.btn-mic{width:34px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--tx2);background:var(--soft)}
.btn-mic:hover{color:var(--tx)}
.btn-mic.rec{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,64,58,.5)}70%{box-shadow:0 0 0 10px rgba(214,64,58,0)}100%{box-shadow:0 0 0 0 rgba(214,64,58,0)}}
#ouvindo{font-size:13px;color:var(--red);margin-top:6px;display:none}
#ouvindo.on{display:block}
.hint{font-size:12.5px;color:var(--tx3);margin:8px 2px 0}
.hint code{background:var(--soft);color:var(--tx2);padding:1px 5px;border-radius:4px;font-family:inherit}

/* resumo + filtros */
.summary{display:flex;gap:8px;margin:20px 0 10px;flex-wrap:wrap}
.stat{flex:1;min-width:90px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--tx2)}
.stat.late b{color:var(--red)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--tx2)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}

/* seções */
section{margin-top:22px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tx2)}
.sec-h .n{font-weight:500;color:var(--tx3)}
.sec-h.late{color:var(--red)}
.sec-h.hoje{color:var(--acc)}
.sec-h button{margin-left:auto;font-size:12px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--tx3)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}

.task{display:flex;align-items:flex-start;gap:12px;padding:11px 12px 11px 14px;border-top:1px solid var(--line);position:relative}
.task:first-child{border-top:0}
.check{flex:none;width:21px;height:21px;margin-top:1px;border-radius:50%;border:2px solid var(--tx3);display:grid;place-items:center}
.check:hover{border-color:var(--acc)}
.task.p-alta .check{border-color:var(--red)}
.task.done .check{background:var(--grn);border-color:var(--grn)}
.task.done .check::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.body{flex:1;min-width:0}
.title{word-wrap:break-word;cursor:text}
.task.done .title{text-decoration:line-through;color:var(--tx3)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:12.5px;color:var(--tx2)}
.tag{padding:1px 7px;border-radius:5px;background:var(--soft)}
.tag.date-late{background:var(--red-soft);color:var(--red)}
.tag.date-today{background:var(--acc-soft);color:var(--acc)}
.tag.alta{background:var(--red-soft);color:var(--red);font-weight:600}
.tag.baixa{color:var(--tx3)}
.tag.rec{background:var(--grn-soft);color:var(--grn)}
.more{flex:none;width:30px;height:28px;border-radius:6px;color:var(--tx3);font-size:18px;line-height:1}
.more:hover{background:var(--soft);color:var(--tx)}
.edit{width:100%;font:inherit;color:var(--tx);background:var(--soft);border:1px solid var(--acc);border-radius:6px;padding:3px 6px;outline:0}

.menu{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px 47px}
.menu button{font-size:13px;padding:4px 10px;border-radius:7px;background:var(--soft)}
.menu button:hover{background:var(--line)}
.menu .del{color:var(--red)}

.empty{text-align:center;color:var(--tx2);padding:48px 16px}
.empty b{display:block;font-size:17px;color:var(--tx);margin-bottom:4px}

details.done-box{margin-top:22px}
details.done-box summary{list-style:none;cursor:pointer;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);margin:0 2px 8px}
details.done-box summary::-webkit-details-marker{display:none}
details.done-box summary::before{content:"▸ "}
details.done-box[open] summary::before{content:"▾ "}

footer{margin-top:40px;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;font-size:13px}
footer button{color:var(--tx3)}
footer button:hover{color:var(--tx)}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;display:flex;gap:14px;align-items:center;font-size:14px;transition:transform .2s;z-index:10;max-width:calc(100% - 32px)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast button{color:var(--acc);font-weight:700;filter:brightness(1.3)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Rotina</h1>
    <div class="today" id="hojeLabel"></div>
  </header>

  <div class="composer">
    <textarea id="entrada" rows="1" placeholder="O que você precisa fazer?" autocomplete="off"></textarea>
    <div class="composer-foot">
      <div id="preview"></div>
      <button class="btn-mic" id="btnMic" hidden aria-label="Falar tarefa" title="Falar tarefa">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
      </button>
      <button class="btn-add" id="btnAdd" disabled>Adicionar</button>
    </div>
  </div>
  <div id="ouvindo">● Ouvindo… fale suas tarefas. Faça uma pausa ou diga “próxima tarefa” entre uma e outra. Toque no microfone para parar.</div>
  <p class="hint">Escreva ou fale do seu jeito: <code>pagar boleto amanhã!</code> <code>dentista sexta 14h</code> <code>academia todo dia</code> <code>relatório dia 20 #trabalho</code>. Pode colar várias, uma por linha.</p>

  <div class="summary" id="summary"></div>
  <div class="filters" id="filters"></div>
  <div id="lists"></div>

  <footer>
    <button id="btnExport">Baixar backup</button>
    <button id="btnImport">Restaurar backup</button>
    <button id="btnClearDone">Apagar concluídas</button>
    <button id="btnInstall" hidden>Instalar app</button>
    <input type="file" id="fileImport" accept="application/json" hidden>
  </footer>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Desfazer</button></div>

<script>
(() => {
'use strict';

/* ================= armazenamento ================= */
const KEY = 'rotina_tarefas_v1';
let tasks = [];
try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch { tasks = []; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch {} };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ================= datas ================= */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const diffDays = (a, b) => Math.round((fromIso(a) - fromIso(b)) / 864e5);
const DOW = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const DOW_FULL = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

function nextWeekday(dow, forceNext) {
  const t = today();
  let delta = (dow - t.getDay() + 7) % 7;
  if (forceNext && delta === 0) delta = 7;
  return addDays(t, delta);
}

/* ================= interpretador de texto ================= */
const END = '(?=$|[\\s,.;:!?)])';
const S = '(^|\\s)';
const WD = { 'domingo': 0, 'segunda': 1, 'terca': 2, 'terça': 2, 'quarta': 3, 'quinta': 4, 'sexta': 5, 'sabado': 6, 'sábado': 6 };
const WD_RE = '(domingo|segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado)(?:-feira)?';
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

const CATS = [
  { id: 'Trabalho', kw: ['reuniao', 'email', 'e-mail', 'cliente', 'relatorio', 'projeto', 'apresentacao', 'planilha', 'chefe', 'trabalho', 'entregar', 'proposta', 'call', 'meet', 'enviar', 'responder', 'orcamento', 'contrato'] },
  { id: 'Finanças', kw: ['pagar', 'boleto', 'conta ', 'contas', 'fatura', 'pix', 'banco', 'imposto', 'irpf', 'cartao', 'transferir', 'aluguel', 'condominio', 'dinheiro', 'cobrar', 'nota fiscal'] },
  { id: 'Saúde', kw: ['medico', 'dentista', 'academia', 'remedio', 'exame', 'consulta', 'treino', 'treinar', 'correr', 'corrida', 'caminhar', 'yoga', 'terapia', 'psicolog', 'vacina', 'farmacia', 'beber agua', 'dormir', 'nutri'] },
  { id: 'Estudos', kw: ['estudar', 'prova', 'curso', 'aula', 'livro', 'ler ', 'leitura', 'faculdade', 'trabalho da', 'tcc', 'revisar', 'exercicio', 'ingles', 'idioma'] },
  { id: 'Casa', kw: ['limpar', 'lavar', 'mercado', 'compras', 'comprar', 'cozinhar', 'roupa', 'louca', 'lixo', 'arrumar', 'consertar', 'faxina', 'casa', 'passar roupa', 'regar', 'cachorro', 'gato', 'pet'] },
];

function guessCategory(title) {
  const t = ' ' + norm(title) + ' ';
  let best = null, bestScore = 0;
  for (const c of CATS) {
    let score = 0;
    for (const k of c.kw) if (t.includes(' ' + k) || t.includes(k + ' ')) score++;
    if (score > bestScore) { best = c.id; bestScore = score; }
  }
  return best || 'Pessoal';
}

function parse(raw) {
  let s = ' ' + raw.trim() + ' ';
  const out = { due: null, time: null, priority: 'normal', category: null, recur: null };
  const take = (re, fn) => {
    s = s.replace(new RegExp(re, 'iu'), (...m) => { fn(m); return ' '; });
  };
  const t = today();

  // números por extenso (comum quando vem de áudio)
  const NUM = { um: 1, uma: 1, dois: 2, duas: 2, tres: 3, 'três': 3, quatro: 4, cinco: 5, seis: 6, sete: 7, oito: 8, nove: 9, dez: 10, onze: 11, doze: 12, quinze: 15, vinte: 20, trinta: 30 };
  s = s.replace(/(^|\s)(um|uma|dois|duas|tr[êe]s|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|quinze|vinte|trinta)(?=\s+(dias?|horas?|da|de|e meia)\b)/giu,
    (_, a, w) => a + NUM[w.toLowerCase()]);
  s = s.replace(/(^|\s)(?:ao\s+)?meio[- ]dia(?:\s+e\s+meia)?(?=$|[\s,.;:!?)])/giu, (m, a) => a + (/meia/i.test(m) ? '12:30' : '12h'));
  s = s.replace(/(^|\s)meia[- ]noite(?=$|[\s,.;:!?)])/giu, (_, a) => a + '0h');
  // "3 da tarde", "8 da noite", "9 da manhã", "às 3 e meia da tarde", "15 horas"
  s = s.replace(/(^|\s)(?:([àa]s|a partir das)\s+)?(\d{1,2})(?:\s*(?:horas?|h))?(\s+e\s+meia|:(\d{2}))?\s+(?:horas?\s+)?(da|de)\s+(manh[ãa]|tarde|noite|madrugada)(?=$|[\s,.;:!?)])/giu,
    (_, a, as, h, extra, mins, __, per) => {
      let hh = +h; const p = norm(per);
      if ((p === 'tarde' || p === 'noite') && hh < 12) hh += 12;
      const mm = extra ? (mins || '30') : '00';
      return `${a}${pad(hh)}:${mm}`;
    });
  s = s.replace(/(^|\s)(\d{1,2})\s+horas?(?:\s+e\s+meia)?(?=$|[\s,.;:!?)])/giu, (m, a, h) => `${a}${pad(+h)}:${/meia/i.test(m) ? '30' : '00'}`);
  s = s.replace(/(^|\s)(\d{1,2})\s+e\s+meia(?=$|[\s,.;:!?)])/giu, (_, a, h) => `${a}${pad(+h)}:30`);

  // recorrência
  take(S + '(todo dia|todos os dias|diariamente|di[áa]rio)' + END, () => { out.recur = { type: 'daily' }; });
  take(S + '(?:toda|todo|todas as|todos os)\\s+' + WD_RE + 's?' + END, m => {
    const dow = WD[norm(m[2])] ?? WD[m[2].toLowerCase()];
    out.recur = { type: 'weekly', dow }; out.due = iso(nextWeekday(dow));
  });
  take(S + '(toda semana|todas as semanas|semanalmente)' + END, () => { out.recur = { type: 'weekly' }; });
  take(S + '(todo m[êe]s|todos os meses|mensalmente)' + END, () => { out.recur = { type: 'monthly' }; });
  take(S + '(dias [úu]teis|seg(?:unda)? a sex(?:ta)?)' + END, () => { out.recur = { type: 'weekdays' }; });

  // datas relativas
  take(S + '(depois de amanh[ãa])' + END, () => { out.due = iso(addDays(t, 2)); });
  take(S + '(amanh[ãa])' + END, () => { out.due = iso(addDays(t, 1)); });
  take(S + '(hoje|hj|agora)' + END, () => { out.due = iso(t); });
  take(S + '(ontem)' + END, () => { out.due = iso(addDays(t, -1)); });
  take(S + '(semana que vem|pr[óo]xima semana)' + END, () => { out.due = iso(nextWeekday(1, true)); });
  take(S + '((?:no |neste |nesse |este |esse )?fim de semana|(?:no |neste |nesse )?fds)' + END, () => { out.due = iso(nextWeekday(6)); });
  take(S + '(m[êe]s que vem|pr[óo]ximo m[êe]s)' + END, () => { out.due = iso(new Date(t.getFullYear(), t.getMonth() + 1, 1)); });
  take(S + '(?:(pr[óo]xim[ao])\\s+|(?:na|no|nesta|neste|nessa|nesse|esta|este|essa|esse)\\s+)?' + WD_RE + END, m => {
    const dow = WD[norm(m[3])];
    out.due = iso(nextWeekday(dow, !!m[2]));
  });
  // dd/mm(/aaaa)
  take(S + '(?:dia\\s+)?(\\d{1,2})[/.-](\\d{1,2})(?:[/.-](\\d{2,4}))?' + END, m => {
    const d = +m[2], mo = +m[3] - 1;
    let y = m[4] ? +m[4] : t.getFullYear();
    if (y < 100) y += 2000;
    let dt = new Date(y, mo, d);
    if (!m[4] && (t - dt) > 60 * 864e5) dt = new Date(y + 1, mo, d);
    if (dt.getDate() === d) out.due = iso(dt);
  });
  // "dia 15"
  take(S + 'dia\\s+(\\d{1,2})' + END, m => {
    const d = +m[2];
    if (d < 1 || d > 31) return;
    let dt = new Date(t.getFullYear(), t.getMonth(), d);
    if (dt < t || dt.getDate() !== d) dt = new Date(t.getFullYear(), t.getMonth() + 1, d);
    out.due = iso(dt);
  });
  // "em 3 dias"
  take(S + '(?:em|daqui a)\\s+(\\d{1,3})\\s+dias?' + END, m => { out.due = iso(addDays(t, +m[2])); });

  // horário: 14h, 14h30, 14:30, às 9
  take(S + '(?:(?:[àa]s|a partir das)\\s+(\\d{1,2})(?:(?:h|:)(\\d{2})?)?|(\\d{1,2})(?:h(\\d{2})?|:(\\d{2})))' + END, m => {
    const h = +(m[2] ?? m[4]), mi = +(m[3] ?? m[5] ?? m[6] ?? 0);
    if (h <= 23 && mi <= 59) out.time = `${pad(h)}:${pad(mi)}`;
  });

  // prioridade
  if (/!/.test(s)) { out.priority = 'alta'; s = s.replace(/!+/g, ' '); }
  take(S + '(é urgente|urgente|important[ei]|prioridade alta|prioridade|asap)' + END, () => { out.priority = 'alta'; });
  take(S + '(quando der|sem pressa|algum dia|baixa prioridade)' + END, () => { out.priority = 'baixa'; });

  // categoria explícita
  take(S + '#([\\p{L}\\d_-]+)', m => {
    const v = m[2];
    const found = CATS.find(c => norm(c.id) === norm(v)) || (norm(v) === 'pessoal' && { id: 'Pessoal' });
    out.category = found ? found.id : v.charAt(0).toUpperCase() + v.slice(1);
  });

  let title = s.replace(/\s+/g, ' ').trim().replace(/^[-–•*]\s*/, '').replace(/\s+(e|de|para|pra|no|na|até|ate)$/i, '');
  if (!title) title = raw.trim();
  out.title = title.charAt(0).toUpperCase() + title.slice(1);
  if (!out.category) out.category = guessCategory(out.title);
  if (out.time && !out.due) out.due = iso(t);
  if (out.recur && !out.due) {
    if (out.recur.type === 'weekdays') { let d = t; while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1); out.due = iso(d); }
    else out.due = iso(t);
  }
  if (out.recur && out.recur.type === 'weekly' && out.recur.dow == null) out.recur.dow = fromIso(out.due).getDay();
  return out;
}

function nextOccurrence(task) {
  const r = task.recur, base = fromIso(task.due || iso(today()));
  let d;
  if (r.type === 'daily') d = addDays(base, 1);
  else if (r.type === 'weekly') d = addDays(base, 7);
  else if (r.type === 'monthly') d = new Date(base.getFullYear(), base.getMonth() + 1, base.getDate());
  else if (r.type === 'weekdays') { d = addDays(base, 1); while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1); }
  // se ficou no passado, avança até hoje ou depois
  const t = today();
  while (d < t) {
    if (r.type === 'daily') d = addDays(d, 1);
    else if (r.type === 'weekly') d = addDays(d, 7);
    else if (r.type === 'monthly') d = new Date(d.getFullYear(), d.getMonth() + 1, d.getDate());
    else { d = addDays(d, 1); while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1); }
  }
  return iso(d);
}

/* ================= rótulos ================= */
function dateLabel(due) {
  const td = iso(today()), n = diffDays(due, td), d = fromIso(due);
  if (n === 0) return 'hoje';
  if (n === 1) return 'amanhã';
  if (n === -1) return 'ontem';
  if (n < 0) return `há ${-n} dias`;
  if (n < 7) return DOW_FULL[d.getDay()];
  return `${DOW[d.getDay()]}, ${d.getDate()} ${MES[d.getMonth()]}`;
}
function recurLabel(r) {
  if (!r) return '';
  if (r.type === 'daily') return 'todo dia';
  if (r.type === 'weekdays') return 'dias úteis';
  if (r.type === 'monthly') return 'todo mês';
  return 'toda ' + DOW_FULL[r.dow];
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ================= estado da UI ================= */
let filter = 'Todas';
let openMenu = null;
let editing = null;

const $ = id => document.getElementById(id);
const entrada = $('entrada'), preview = $('preview'), btnAdd = $('btnAdd');

function bucket(t) {
  if (!t.due) return 'semdata';
  const td = iso(today()), n = diffDays(t.due, td);
  if (n < 0) return 'atrasadas';
  if (n === 0) return 'hoje';
  if (n === 1) return 'amanha';
  const dow = today().getDay();
  const toSunday = dow === 0 ? 0 : 7 - dow;
  if (n <= toSunday) return 'semana';
  return 'depois';
}
const SECTIONS = [
  ['atrasadas', 'Atrasadas', 'late'],
  ['hoje', 'Hoje', 'hoje'],
  ['amanha', 'Amanhã', ''],
  ['semana', 'Esta semana', ''],
  ['depois', 'Próximas', ''],
  ['semdata', 'Sem data', ''],
];
const PRI = { alta: 0, normal: 1, baixa: 2 };
function sortTasks(a, b) {
  if (a.due !== b.due) return (a.due || '9999') < (b.due || '9999') ? -1 : 1;
  if (a.priority !== b.priority) return PRI[a.priority] - PRI[b.priority];
  if (a.time !== b.time) return (a.time || '99') < (b.time || '99') ? -1 : 1;
  return a.created - b.created;
}

/* ================= render ================= */
function taskHTML(t, sec) {
  const tags = [];
  if (t.due && !t.done && sec !== 'hoje' && sec !== 'amanha') {
    tags.push(`<span class="tag ${sec === 'atrasadas' ? 'date-late' : ''}">${esc(dateLabel(t.due))}</span>`);
  }
  if (t.done && t.doneAt) tags.push(`<span class="tag">feito ${esc(dateLabel(t.doneAt))}</span>`);
  if (t.time) tags.push(`<span class="tag ${sec === 'hoje' ? 'date-today' : ''}">${t.time}</span>`);
  if (t.priority === 'alta') tags.push('<span class="tag alta">urgente</span>');
  if (t.priority === 'baixa') tags.push('<span class="tag baixa">sem pressa</span>');
  if (t.recur) tags.push(`<span class="tag rec">↻ ${esc(recurLabel(t.recur))}</span>`);
  tags.push(`<span class="tag">${esc(t.category)}</span>`);

  const titleHTML = editing === t.id
    ? `<input class="edit" data-edit="${t.id}" value="${esc(t.title)}">`
    : `<div class="title" data-act="edit" data-id="${t.id}">${esc(t.title)}</div>`;

  const menu = openMenu === t.id ? `<div class="menu">
      <button data-act="move" data-to="0" data-id="${t.id}">Hoje</button>
      <button data-act="move" data-to="1" data-id="${t.id}">Amanhã</button>
      <button data-act="move" data-to="week" data-id="${t.id}">Próx. semana</button>
      <button data-act="move" data-to="none" data-id="${t.id}">Sem data</button>
      <button data-act="prio" data-id="${t.id}">${t.priority === 'alta' ? 'Tirar urgência' : 'Marcar urgente'}</button>
      ${t.recur ? `<button data-act="norecur" data-id="${t.id}">Parar de repetir</button>` : ''}
      <button class="del" data-act="del" data-id="${t.id}">Excluir</button>
    </div>` : '';

  return `<div class="task p-${t.priority} ${t.done ? 'done' : ''}">
      <button class="check" data-act="toggle" data-id="${t.id}" aria-label="Concluir"></button>
      <div class="body">${titleHTML}<div class="meta">${tags.join('')}</div></div>
      <button class="more" data-act="menu" data-id="${t.id}" aria-label="Opções">⋯</button>
    </div>${menu}`;
}

function render() {
  const td = iso(today());
  const d = today();
  $('hojeLabel').textContent = `${DOW_FULL[d.getDay()]}, ${d.getDate()} de ${['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][d.getMonth()]}`;

  const pending = tasks.filter(t => !t.done);
  const nLate = pending.filter(t => bucket(t) === 'atrasadas').length;
  const nToday = pending.filter(t => bucket(t) === 'hoje').length;
  const nDoneToday = tasks.filter(t => t.done && t.doneAt === td).length;
  $('summary').innerHTML = tasks.length ? `
    <div class="stat"><b>${nToday}</b><span>para hoje</span></div>
    ${nLate ? `<div class="stat late"><b>${nLate}</b><span>atrasada${nLate > 1 ? 's' : ''}</span></div>` : ''}
    <div class="stat"><b>${pending.length}</b><span>pendentes</span></div>
    <div class="stat"><b>${nDoneToday}</b><span>feitas hoje</span></div>` : '';

  const cats = [...new Set(tasks.map(t => t.category))].sort();
  if (filter !== 'Todas' && !cats.includes(filter)) filter = 'Todas';
  $('filters').innerHTML = cats.length > 1
    ? ['Todas', ...cats].map(c => {
        const n = c === 'Todas' ? pending.length : pending.filter(t => t.category === c).length;
        return `<button class="chip ${filter === c ? 'on' : ''}" data-filter="${esc(c)}">${esc(c)} ${n ? '· ' + n : ''}</button>`;
      }).join('')
    : '';

  const visible = tasks.filter(t => filter === 'Todas' || t.category === filter);
  const vPending = visible.filter(t => !t.done).sort(sortTasks);
  const vDone = visible.filter(t => t.done).sort((a, b) => (b.doneTs || 0) - (a.doneTs || 0));

  let html = '';
  if (!tasks.length) {
    html = `<div class="empty"><b>Nada por aqui ainda</b>Escreva suas tarefas acima — eu separo por dia, prioridade e assunto.</div>`;
  } else if (!vPending.length) {
    html = `<div class="empty"><b>Tudo em dia ✓</b>Nenhuma tarefa pendente${filter !== 'Todas' ? ' em ' + esc(filter) : ''}.</div>`;
  }
  for (const [key, label, cls] of SECTIONS) {
    const items = vPending.filter(t => bucket(t) === key);
    if (!items.length) continue;
    const extra = key === 'atrasadas' && items.length > 1
      ? `<button data-act="lateToday">Mover todas p/ hoje</button>` : '';
    html += `<section><div class="sec-h ${cls}">${label} <span class="n">${items.length}</span>${extra}</div>
      <div class="list">${items.map(t => taskHTML(t, key)).join('')}</div></section>`;
  }
  if (vDone.length) {
    const shown = vDone.slice(0, 30);
    html += `<details class="done-box" ${doneOpen ? 'open' : ''}><summary>Concluídas · ${vDone.length}</summary>
      <div class="list">${shown.map(t => taskHTML(t, 'done')).join('')}</div></details>`;
  }
  $('lists').innerHTML = html;

  const ed = document.querySelector('[data-edit]');
  if (ed) { ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length); }
}
let doneOpen = false;
document.addEventListener('toggle', e => { if (e.target.classList?.contains('done-box')) doneOpen = e.target.open; }, true);

/* ================= entrada ================= */
const lines = () => entrada.value.split('\n').map(l => l.trim()).filter(Boolean);

function updatePreview() {
  entrada.style.height = 'auto';
  entrada.style.height = entrada.scrollHeight + 'px';
  const ls = lines();
  btnAdd.disabled = !ls.length;
  btnAdd.textContent = ls.length > 1 ? `Adicionar ${ls.length}` : 'Adicionar';
  if (ls.length !== 1) { preview.innerHTML = ls.length > 1 ? `<span>${ls.length} tarefas</span>` : ''; return; }
  const p = parse(ls[0]);
  const bits = [];
  bits.push(p.due ? dateLabel(p.due) : 'sem data');
  if (p.time) bits.push(p.time);
  if (p.priority === 'alta') bits.push('urgente');
  if (p.priority === 'baixa') bits.push('sem pressa');
  if (p.recur) bits.push('↻ ' + recurLabel(p.recur));
  bits.push(p.category);
  preview.innerHTML = '→ ' + bits.map(b => `<span class="tag">${esc(b)}</span>`).join('');
}

function addFromInput() {
  const ls = lines();
  if (!ls.length) return;
  const now = Date.now();
  ls.forEach((l, i) => {
    const p = parse(l);
    tasks.push({ id: uid(), title: p.title, due: p.due, time: p.time, priority: p.priority, category: p.category, recur: p.recur, done: false, created: now + i });
  });
  save();
  entrada.value = '';
  updatePreview();
  render();
  toast(ls.length > 1 ? `${ls.length} tarefas adicionadas` : 'Tarefa adicionada');
}

entrada.addEventListener('input', updatePreview);
entrada.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); addFromInput(); }
});
btnAdd.addEventListener('click', () => { addFromInput(); entrada.focus(); });

/* ================= voz ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const btnMic = $('btnMic');
if (SR) {
  btnMic.hidden = false;
  let rec = null, listening = false, baseText = '', finalText = '';
  // palavras que separam uma tarefa da outra quando você fala
  const SPLIT = /\s*\b(?:pr[óo]xima tarefa|outra tarefa|nova tarefa|ponto final|tamb[ée]m preciso|e tamb[ée]m)\b[,.]?\s*/giu;
  const toLines = txt => txt.replace(SPLIT, '\n').split('\n').map(l => l.trim().replace(/[.,]+$/, '')).filter(Boolean).join('\n');

  const show = interim => {
    const spoken = toLines(finalText + ' ' + interim);
    entrada.value = [baseText, spoken].filter(Boolean).join('\n');
    updatePreview();
  };
  const stop = () => {
    listening = false;
    btnMic.classList.remove('rec');
    $('ouvindo').classList.remove('on');
    try { rec && rec.stop(); } catch {}
    entrada.focus();
  };
  const start = () => {
    rec = new SR();
    rec.lang = 'pt-BR';
    rec.continuous = true;
    rec.interimResults = true;
    baseText = entrada.value.trim();
    finalText = '';
    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalText += '\nnova tarefa ' + r[0].transcript; // cada pausa vira uma linha
        else interim += r[0].transcript;
      }
      show(interim);
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('Permita o uso do microfone no navegador');
      else if (e.error === 'no-speech') toast('Não ouvi nada. Tente de novo');
      else if (e.error !== 'aborted') toast('Erro no áudio: ' + e.error);
      stop();
    };
    // alguns navegadores param sozinhos depois de um tempo: reinicia enquanto estiver ligado
    rec.onend = () => {
      if (listening) { baseText = entrada.value.trim(); finalText = ''; try { rec.start(); } catch { stop(); } }
    };
    try { rec.start(); } catch { toast('Não consegui acessar o microfone'); return; }
    listening = true;
    btnMic.classList.add('rec');
    $('ouvindo').classList.add('on');
  };
  btnMic.addEventListener('click', () => listening ? stop() : start());
}

/* ================= ações ================= */
let undoFn = null, toastTimer = null;
function toast(msg, undo) {
  $('toastMsg').textContent = msg;
  undoFn = undo || null;
  $('toastUndo').style.display = undo ? '' : 'none';
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4000);
}
$('toastUndo').addEventListener('click', () => {
  if (undoFn) { undoFn(); undoFn = null; save(); render(); }
  $('toast').classList.remove('show');
});

const find = id => tasks.find(t => t.id === id);
const snapshot = () => JSON.parse(JSON.stringify(tasks));

document.addEventListener('click', e => {
  const f = e.target.closest('[data-filter]');
  if (f) { filter = f.dataset.filter; render(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const t = find(el.dataset.id);
  const act = el.dataset.act;
  const before = snapshot();
  const undo = () => { tasks = before; };

  if (act === 'toggle' && t) {
    if (!t.done) {
      t.done = true; t.doneAt = iso(today()); t.doneTs = Date.now();
      if (t.recur) {
        tasks.push({ ...t, id: uid(), done: false, doneAt: null, doneTs: null, due: nextOccurrence(t), created: Date.now() });
        t.recur = null;
        toast('Feito! Próxima: ' + dateLabel(tasks[tasks.length - 1].due), undo);
      } else toast('Concluída ✓', undo);
    } else { t.done = false; t.doneAt = null; t.doneTs = null; }
    openMenu = null;
  } else if (act === 'menu') {
    openMenu = openMenu === t.id ? null : t.id;
    render(); return;
  } else if (act === 'edit' && t) {
    editing = t.id; openMenu = null; render(); return;
  } else if (act === 'move' && t) {
    const to = el.dataset.to;
    t.due = to === 'none' ? null : to === 'week' ? iso(nextWeekday(1, true)) : iso(addDays(today(), +to));
    if (!t.due) t.time = null;
    openMenu = null;
    toast('Movida para ' + (t.due ? dateLabel(t.due) : 'sem data'), undo);
  } else if (act === 'prio' && t) {
    t.priority = t.priority === 'alta' ? 'normal' : 'alta';
  } else if (act === 'norecur' && t) {
    t.recur = null; openMenu = null;
  } else if (act === 'del' && t) {
    tasks = tasks.filter(x => x.id !== t.id); openMenu = null;
    toast('Tarefa excluída', undo);
  } else if (act === 'lateToday') {
    const td = iso(today());
    tasks.forEach(x => { if (!x.done && bucket(x) === 'atrasadas') x.due = td; });
    toast('Atrasadas movidas para hoje', undo);
  } else return;
  save(); render();
});

function commitEdit(input) {
  const t = find(input.dataset.edit);
  editing = null;
  if (t) {
    const v = input.value.trim();
    if (v && v !== t.title) {
      const p = parse(v);
      t.title = p.title;
      if (p.due) t.due = p.due;
      if (p.time) t.time = p.time;
      if (p.priority !== 'normal') t.priority = p.priority;
      if (p.recur) t.recur = p.recur;
      if (/#/.test(v)) t.category = p.category;
      save();
    }
  }
  render();
}
document.addEventListener('keydown', e => {
  if (e.target.matches?.('[data-edit]')) {
    if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
    if (e.key === 'Escape') { editing = null; render(); }
  }
});
document.addEventListener('focusout', e => { if (e.target.matches?.('[data-edit]') && editing) commitEdit(e.target); });

/* ================= backup ================= */
$('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `rotina-backup-${iso(today())}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('btnImport').addEventListener('click', () => $('fileImport').click());
$('fileImport').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data)) throw 0;
    const before = snapshot();
    const ids = new Set(tasks.map(t => t.id));
    data.forEach(t => { if (t && t.id && t.title && !ids.has(t.id)) tasks.push(t); });
    save(); render();
    toast('Backup restaurado', () => { tasks = before; });
  } catch { toast('Arquivo inválido'); }
  e.target.value = '';
});
$('btnClearDone').addEventListener('click', () => {
  const n = tasks.filter(t => t.done).length;
  if (!n) { toast('Nenhuma concluída'); return; }
  const before = snapshot();
  tasks = tasks.filter(t => !t.done);
  save(); render();
  toast(`${n} concluída${n > 1 ? 's' : ''} apagada${n > 1 ? 's' : ''}`, () => { tasks = before; });
});

// atualiza ao virar o dia / voltar para a aba
let lastDay = iso(today());
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && iso(today()) !== lastDay) { lastDay = iso(today()); render(); }
});

// app instalável + offline
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('btnInstall').hidden = false; });
$('btnInstall').addEventListener('click', async () => {
  if (!installEvt) return;
  installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('btnInstall').hidden = true;
});
window.addEventListener('appinstalled', () => { $('btnInstall').hidden = true; toast('App instalado ✓'); });

window.__parse = parse; // útil para testes
render();
updatePreview();
})();
</script>
</body>
</html>
